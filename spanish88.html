[data-theme="sunset"]{--bg:#1a0a0a;--bg2:#240d0d;--card:#2c1414;--card2:#3a1a1a;--fg:#fee2e2;--muted:#d4a0a0;--line:#4c1e1e;--accent:#f97316;--accent2:#fb923c;--hl:#fb7185;--ok:#22c55e;--shadow:0 4px 20px rgba(0,0,0,.45)}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Tajawal','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);line-height:1.7;min-height:100vh;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
.es{direction:ltr;unicode-bidi:isolate;display:inline-block}
img{max-width:100%}

#preloader{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.4rem;transition:opacity .6s,visibility .6s}
#preloader.hide{opacity:0;visibility:hidden}
.pl-logo{font-family:'Inter',sans-serif;font-size:2rem;font-weight:800;letter-spacing:4px;background:linear-gradient(135deg,var(--accent),var(--hl));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:plPulse 1.5s ease-in-out infinite}
.pl-sub{color:var(--muted);font-size:.85rem;letter-spacing:1px}
.pl-ring{width:52px;height:52px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:plSpin .9s linear infinite}
@keyframes plSpin{to{transform:rotate(360deg)}}
@keyframes plPulse{0%,100%{opacity:1}50%{opacity:.5}}

header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.head-inner{max-width:1000px;margin:0 auto;padding:.85rem 1.2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:.55rem;flex:1;min-width:0}
.brand h1{font-family:'Inter',sans-serif;font-size:1.3rem;font-weight:800;color:var(--accent);letter-spacing:2px;background:linear-gradient(135deg,var(--accent),var(--hl));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand small{color:var(--muted);font-size:.72rem;font-weight:500}
.search-btn,.theme-btn{width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:1.1rem;transition:all .2s}
.search-btn:hover,.theme-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.theme-btn:active{transform:scale(.9) rotate(180deg)}

.search-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);z-index:100;display:none;padding:1.2rem}
.search-overlay.open{display:block}
.search-box{max-width:600px;margin:3rem auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.search-box input{width:100%;padding:1rem 1.2rem;background:transparent;border:none;outline:none;color:var(--fg);font-size:1.05rem;border-bottom:1px solid var(--line)}
.search-results{max-height:60vh;overflow-y:auto;padding:.5rem}
.sr-item{padding:.7rem .9rem;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:.8rem;transition:background .15s}
.sr-item:hover{background:var(--card2)}
.sr-item .es{color:var(--hl);font-weight:600;font-size:.9rem}
.sr-item .ar{color:var(--muted);font-size:.85rem}
.sr-empty{text-align:center;padding:2rem;color:var(--muted)}

.tabs{position:sticky;top:57px;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs-inner{max-width:1000px;margin:0 auto;padding:.55rem 1.2rem;display:flex;gap:.4rem}
.tab{padding:.5rem 1rem;border-radius:10px;font-size:.88rem;font-weight:500;color:var(--muted);white-space:nowrap;transition:all .2s;border:1px solid transparent}
.tab:hover{color:var(--fg)}
.tab.active{background:var(--card);color:var(--accent);border-color:var(--line);font-weight:700}

main{max-width:1000px;margin:0 auto;padding:1.5rem 1.2rem 3rem;min-height:calc(100vh - 200px)}
.view{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.4rem;margin-bottom:1rem;transition:all .2s}
.card.hoverable:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}

.hero::before{content:"";position:absolute;top:-50%;inset-inline-end:-20%;width:280px;height:280px;background:radial-gradient(circle,var(--accent) 0%,transparent 70%);opacity:.18;pointer-events:none}
.hero h2{font-size:1.6rem;margin-bottom:.4rem;position:relative;z-index:1}

.streak{display:inline-flex;align-items:center;gap:.5rem;background:rgba(245,158,11,.15);color:var(--accent);padding:.4rem .9rem;border-radius:99px;font-size:.85rem;font-weight:700;margin-bottom:.8rem;position:relative;z-index:1}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem;margin-bottom:1.4rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;text-align:center}
.stat-num{font-size:1.7rem;font-weight:800;color:var(--accent);font-family:'Inter',sans-serif;line-height:1.2}

.today-card{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0a0f1e;border-radius:20px;padding:1.6rem;position:relative;overflow:hidden;margin-bottom:1.4rem;cursor:pointer;transition:transform .2s}
.today-card:hover{transform:translateY(-3px)}
.today-card::after{content:"📘";position:absolute;inset-inline-end:-10px;bottom:-25px;font-size:8rem;opacity:.12;transform:rotate(15deg)}
.today-card .day-tag{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;opacity:.75}
.today-card h3{font-size:1.4rem;margin:.4rem 0 .2rem;font-weight:800}
.today-card .sub{font-size:.9rem;opacity:.8}
.today-card .cta{margin-top:1rem;display:inline-flex;align-items:center;gap:.4rem;font-weight:700;font-size:.9rem}

.section-title{display:flex;justify-content:space-between;align-items:center;margin:1.6rem 0 .8rem}
.section-title h3{font-size:1.1rem;font-weight:700}

.filters{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.chip{padding:.4rem .9rem;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:.82rem;color:var(--muted);transition:all .2s;font-weight:500}
.chip:hover{border-color:var(--accent);color:var(--fg)}
.chip.on{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}

.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.8rem}
.lesson-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.1rem;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.lesson-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.lesson-card.done{opacity:.6}
.lesson-card.done::after{content:"✓";position:absolute;top:.7rem;inset-inline-end:.9rem;color:var(--ok);font-weight:800;font-size:1.1rem}
.lc-meta{display:flex;gap:.4rem;align-items:center;margin-bottom:.5rem;flex-wrap:wrap}
.badge{font-size:.68rem;padding:.15rem .5rem;border-radius:6px;font-weight:600;letter-spacing:.3px}
.badge.unit{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.badge.level-A1{background:rgba(16,185,129,.15);color:#10b981}
.badge.level-A2{background:rgba(56,189,248,.15);color:#38bdf8}
.badge.level-B1{background:rgba(167,139,250,.15);color:#a78bfa}
.badge.kind{background:var(--card2);color:var(--muted)}
.lc-title-es{font-family:'Inter',sans-serif;direction:ltr;text-align:right;font-size:1rem;font-weight:700;color:var(--hl);margin-bottom:.15rem}
.lc-title-ar{font-size:.88rem;color:var(--fg);font-weight:500}

.back-btn{display:inline-flex;align-items:center;gap:.35rem;padding:.5rem .9rem;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:.85rem;color:var(--muted);margin-bottom:1rem;transition:all .2s}
.back-btn:hover{border-color:var(--accent);color:var(--fg)}
.lesson-head{padding-bottom:1rem;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
.lesson-head .meta-row{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.7rem}
.lesson-head h2{font-family:'Inter',sans-serif;direction:ltr;text-align:right;font-size:1.5rem;color:var(--hl);font-weight:800;line-height:1.25}
.lesson-head .ar-title{font-size:1.05rem;color:var(--fg);margin-top:.3rem;font-weight:600}

.rule-box{background:var(--card2);border-inline-start:3px solid var(--accent);padding:1rem 1.1rem;border-radius:10px;margin:1rem 0;font-size:.95rem;line-height:1.8}

.conj-table{width:100%;border-collapse:collapse;margin:.7rem 0;background:var(--card2);border-radius:12px;overflow:hidden}
.conj-table th{background:var(--card);padding:.55rem .8rem;text-align:right;font-size:.8rem;color:var(--accent);font-weight:700;border-bottom:1px solid var(--line)}
.conj-table td{padding:.55rem .8rem;border-bottom:1px solid var(--line);font-size:.92rem}
.conj-table tr:last-child td{border-bottom:none}
.conj-table td.es{color:var(--hl);font-weight:700;text-align:left;direction:ltr}
.verb-title{font-family:'Inter',sans-serif;direction:ltr;text-align:right;font-size:1rem;color:var(--accent);font-weight:700;margin:1.2rem 0 .3rem}

.ex-list{display:flex;flex-direction:column;gap:.15rem;margin:.5rem 0}
.ex-row{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:.6rem .8rem;border-radius:8px;cursor:pointer;transition:background .15s;flex-wrap:wrap}
.ex-row:hover{background:var(--card2)}
.ex-row .es{color:var(--hl);font-weight:600;font-family:'Inter',sans-serif;font-size:.95rem}
.ex-row .ar{color:var(--muted);font-size:.9rem}
.ex-row .play{font-size:.75rem;opacity:.4;transition:opacity .2s}
.ex-row:hover .play{opacity:.9}

.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.5rem;margin-top:.6rem}
.vocab-item{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;cursor:pointer;transition:all .15s;position:relative}
.vocab-item:hover{border-color:var(--accent);transform:translateY(-1px)}
.vocab-item .es{font-family:'Inter',sans-serif;color:var(--hl);font-weight:700;font-size:.9rem;display:block}
.vocab-item .ar{color:var(--muted);font-size:.82rem;margin-top:.1rem}

.lesson-actions{display:flex;gap:.5rem;margin:1.5rem 0 1rem;flex-wrap:wrap}
.btn{padding:.7rem 1.3rem;border-radius:12px;font-size:.9rem;font-weight:600;transition:all .2s;border:1px solid var(--line);background:var(--card)}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0a0f1e;border-color:transparent;font-weight:700}
.btn.primary:hover{box-shadow:0 6px 20px rgba(245,158,11,.35)}
.btn.done{background:rgba(16,185,129,.15);color:var(--ok);border-color:var(--ok)}
.nav-prev-next{display:flex;justify-content:space-between;gap:.5rem;margin-top:1.5rem}
.nav-prev-next .btn{flex:1;text-align:center}

.vocab-search{width:100%;padding:.85rem 1.1rem;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--fg);font-size:.95rem;margin-bottom:1rem;outline:none;transition:border .2s}
.vocab-search:focus{border-color:var(--accent)}

.fc-setup{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:1.5rem}
.fc-choice{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.1rem;text-align:center;cursor:pointer;transition:all .2s}
.fc-choice:hover{border-color:var(--accent);transform:translateY(-2px)}
.fc-choice h4{font-size:1rem;margin-bottom:.2rem}
.fc-choice p{color:var(--muted);font-size:.8rem}

.flashcard{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:24px;padding:3rem 2rem;text-align:center;min-height:320px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;transition:all .3s;position:relative;user-select:none}
.flashcard:hover{border-color:var(--accent)}
.flashcard.flipped{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0a0f1e}
.flashcard .fc-word{font-family:'Inter',sans-serif;font-size:2rem;font-weight:800;direction:ltr;margin-bottom:.8rem;word-break:break-word}
.flashcard .fc-hint{color:var(--muted);font-size:.8rem;margin-top:1rem}
.flashcard.flipped .fc-hint{color:rgba(10,15,30,.6)}
.fc-controls{display:flex;gap:.6rem;justify-content:center;margin-top:1.2rem;flex-wrap:wrap}
.fc-counter{text-align:center;color:var(--muted);font-size:.85rem;margin-top:.6rem}

.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty .emoji{font-size:3rem;margin-bottom:.6rem}

footer{border-top:1px solid var(--line);padding:1.5rem 1.2rem;text-align:center;color:var(--muted);font-size:.82rem}
footer a{color:var(--accent)}
footer .reset{display:inline-block;margin-top:.5rem;color:var(--muted);font-size:.75rem;padding:.3rem .7rem;border:1px solid var(--line);border-radius:6px;transition:all .2s}
footer .reset:hover{border-color:var(--accent);color:var(--accent)}

.toast{position:fixed;bottom:1.5rem;inset-inline-start:50%;transform:translateX(50%) translateY(100px);background:var(--card);border:1px solid var(--accent);color:var(--fg);padding:.75rem 1.3rem;border-radius:12px;box-shadow:var(--shadow);opacity:0;transition:all .3s;z-index:200;font-size:.88rem}
.toast.show{opacity:1;transform:translateX(50%) translateY(0)}

@media(max-width:640px){
  .head-inner{padding:.7rem 1rem}
  .brand h1{font-size:1.1rem}
  .brand small{display:none}
  main{padding:1.2rem 1rem 3rem}
  .tabs{top:54px}
  .hero{padding:1.3rem}
  .hero h2{font-size:1.3rem}
  .lesson-head h2{font-size:1.25rem}
  .flashcard{padding:2rem 1.2rem;min-height:260px}
  .flashcard .fc-word{font-size:1.5rem}
  .ex-row{padding:.5rem .6rem}
}
</style>

    ]}
  ]
};

const PRONOUNS = {yo:'أنا',tú:'أنت','él_ella_usted':'هو / هي',nosotros:'نحن',vosotros:'أنتم',ellos_ellas_ustedes:'هم / هن'};
const KIND_LABEL = {grammar:'قواعد',conjugation:'تصريف',vocabulary:'مفردات',note:'ملاحظة'};
const THEMES = ['dark','light','ocean','forest','violet','sunset','sepia'];
const THEME_LABEL = {dark:'ليلي',light:'نهاري',ocean:'محيط',forest:'غابة',violet:'بنفسجي',sunset:'غروب',sepia:'ورقي'};

const FLAT = [];
DATA.units.forEach(u => u.lessons.forEach(l => FLAT.push({unit:u,lesson:l,key:l.id})));
const ALL_VOCAB = [];
DATA.units.forEach(u => u.lessons.forEach(l => { if (l.items) l.items.forEach(it => ALL_VOCAB.push({...it,unit:u.order,unitTitle:u.title_ar,level:u.level,lessonId:l.id,lessonTitle:l.title_ar})); }));

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch{return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
};
const state = {view:'dashboard',filterLevel:'all',filterKind:'all',current:null,vocabQuery:'',fc:{deck:[],i:0,flipped:false}};

function startDate(){let d=store.get('spanish88_start');if(!d){d=new Date().toISOString().slice(0,10);store.set('spanish88_start',d);}return d;}
function dayIndex(){const a=new Date(startDate()+'T00:00:00');const b=new Date();b.setHours(0,0,0,0);return Math.max(0,Math.floor((b-a)/86400000));}
function getProgress(){return store.get('spanish88_progress',{});}
function isDone(id){return !!getProgress()[id];}
function toggleDone(id){const p=getProgress();if(p[id])delete p[id];else p[id]=Date.now();store.set('spanish88_progress',p);}
function updateStreak(){const t=new Date().toISOString().slice(0,10);const y=new Date(Date.now()-86400000).toISOString().slice(0,10);const s=store.get('spanish88_streak',{last:null,count:0});if(s.last===t)return s.count;if(s.last===y)s.count++;else s.count=1;s.last=t;store.set('spanish88_streak',s);return s.count;}
function streak(){return store.get('spanish88_streak',{count:0}).count;}

function speak(text){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=.85;speechSynthesis.speak(u);}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}

function setTheme(name){document.documentElement.setAttribute('data-theme',name);store.set('spanish88_theme',name);}
function cycleTheme(){
  const cur = store.get('spanish88_theme','dark');
  const pool = THEMES.filter(t => t !== cur);
  const next = pool[Math.floor(Math.random() * pool.length)];
  setTheme(next);
  toast('🎨 ' + THEME_LABEL[next]);
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function badge(kind,level){return `<span class="badge level-${level}">${level}</span> <span class="badge kind">${KIND_LABEL[kind]||kind}</span>`;}

function renderDashboard(){
  const di = Math.min(dayIndex(), FLAT.length-1);
  const today = FLAT[di];
  const done = Object.keys(getProgress()).length;
  const pct = Math.round((done / FLAT.length) * 100);
  const st = streak();
  return `
    <div class="view">
      <div class="hero">
        <div class="streak">🔥 ${st} ${st===1?'يوم':'أيام'} متتالية</div>
        <h2>أهلًا بك في SPANISH88</h2>
        <p>تعلّم الإسبانية خطوة بخطوة — درس جديد كل يوم، من A1 إلى B1.</p>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;position:relative;z-index:1">
          <button class="btn primary" onclick="openLesson('${today.lesson.id}')">📘 ابدأ اليوم</button>
          <button class="btn" onclick="go('lessons')">📚 كل الدروس</button>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="stat-num">${FLAT.length}</div><div class="stat-label">درسًا إجمالًا</div></div>
        <div class="stat"><div class="stat-num">${done}</div><div class="stat-label">أكملت</div></div>
        <div class="stat"><div class="stat-num">${ALL_VOCAB.length}</div><div class="stat-label">كلمة</div></div>
        <div class="stat"><div class="stat-num">${pct}%</div><div class="stat-label">التقدم</div></div>
      </div>

      <div class="today-card" onclick="openLesson('${today.lesson.id}')">
        <div class="day-tag">درس اليوم · ${di+1}/${FLAT.length}</div>
        <h3 class="es" style="direction:ltr;text-align:right">${esc(today.lesson.title_es)}</h3>
        <div class="sub">${esc(today.lesson.title_ar)} · ${today.unit.title_ar}</div>
        <div class="cta">افتح الدرس ←</div>
      </div>

      <div class="section-title">
        <h3>الوحدات</h3>
      </div>
      <div class="lesson-grid">
        ${DATA.units.map(u=>{
          const uDone = u.lessons.filter(l=>isDone(l.id)).length;
          const pctU = Math.round((uDone/u.lessons.length)*100);
          return `<div class="lesson-card" onclick="filterUnit(${u.order})">
            <div class="lc-meta">
              <span class="badge level-${u.level}">${u.level}</span>
              <span class="badge unit">وحدة ${u.order}</span>
            </div>
            <div class="lc-title-ar" style="font-weight:700;margin-bottom:.3rem">${esc(u.title_ar)}</div>
            <div style="font-size:.78rem;color:var(--muted);margin-bottom:.5rem">${u.lessons.length} دروس · ${uDone} مكتمل</div>
            <div class="progress" style="height:4px;background:var(--line);border-radius:99px;overflow:hidden"><div style="width:${pctU}%;height:100%;background:var(--accent)"></div></div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

function renderLessons(){
  const filtered = FLAT.filter(({unit,lesson})=>{
    if(state.filterLevel!=='all' && unit.level!==state.filterLevel) return false;
    if(state.filterKind!=='all' && lesson.kind!==state.filterKind) return false;
    return true;
  });
  return `
    <div class="view">
      <div class="section-title"><h3>كل الدروس (${filtered.length})</h3></div>
      <div class="filters">
        <button class="chip ${state.filterLevel==='all'?'on':''}" onclick="setFilter('level','all')">كل المستويات</button>
        <button class="chip ${state.filterLevel==='A1'?'on':''}" onclick="setFilter('level','A1')">A1</button>
        <button class="chip ${state.filterLevel==='A2'?'on':''}" onclick="setFilter('level','A2')">A2</button>
        <button class="chip ${state.filterLevel==='B1'?'on':''}" onclick="setFilter('level','B1')">B1</button>
      </div>
      <div class="filters">
        <button class="chip ${state.filterKind==='all'?'on':''}" onclick="setFilter('kind','all')">الكل</button>
        <button class="chip ${state.filterKind==='grammar'?'on':''}" onclick="setFilter('kind','grammar')">قواعد</button>
        <button class="chip ${state.filterKind==='conjugation'?'on':''}" onclick="setFilter('kind','conjugation')">تصريف</button>
        <button class="chip ${state.filterKind==='vocabulary'?'on':''}" onclick="setFilter('kind','vocabulary')">مفردات</button>
        <button class="chip ${state.filterKind==='note'?'on':''}" onclick="setFilter('kind','note')">ملاحظات</button>
      </div>
      <div class="lesson-grid">
        ${filtered.length===0 ? '<div class="empty"><div class="emoji">🔍</div>لا توجد نتائج</div>' : filtered.map(({unit,lesson})=>`
          <div class="lesson-card ${isDone(lesson.id)?'done':''}" onclick="openLesson('${lesson.id}')">
            <div class="lc-meta">
              <span class="badge unit">وحدة ${unit.order}</span>
              ${badge(lesson.kind,unit.level)}
            </div>
            <div class="lc-title-es">${esc(lesson.title_es)}</div>
            <div class="lc-title-ar">${esc(lesson.title_ar)}</div>
          </div>`).join('')}
      </div>
    </div>`;
}

function renderLesson(){
  const item = FLAT.find(f=>f.lesson.id===state.current);
  if(!item) return '<div class="empty">الدرس غير موجود</div>';
  const {unit,lesson}=item;
  const idx = FLAT.findIndex(f=>f.lesson.id===lesson.id);
  const prev = idx>0?FLAT[idx-1]:null;
  const next = idx<FLAT.length-1?FLAT[idx+1]:null;
  let body = '';
  if(lesson.rule_ar) body += `<div class="rule-box">${esc(lesson.rule_ar)}</div>`;
  if(lesson.content_ar) body += `<div class="rule-box">${esc(lesson.content_ar)}</div>`;
  if(lesson.conjugation){
    for(const [verb,forms] of Object.entries(lesson.conjugation)){
      body += `<div class="verb-title">${esc(verb.replace(/_/g,' / '))}</div><table class="conj-table"><thead><tr><th>الضمير</th><th>التصريف</th></tr></thead><tbody>`;
      for(const [p,f] of Object.entries(forms)){
        body += `<tr><td>${PRONOUNS[p]||p}</td><td class="es" onclick="speak('${esc(f)}')" style="cursor:pointer">${esc(f)} 🔊</td></tr>`;
      }
      body += `</tbody></table>`;
    }
  }
  if(lesson.examples){
    body += `<h3 style="margin:1.2rem 0 .4rem;color:var(--accent);font-size:1rem">أمثلة</h3><div class="ex-list">`;
    lesson.examples.forEach(e=>{
      body += `<div class="ex-row" onclick="speak('${esc(e.es)}')"><span class="es">${esc(e.es)} <span class="play">🔊</span></span><span class="ar">${esc(e.ar)}</span></div>`;
    });
    body += `</div>`;
  }
  if(lesson.items){
    body += `<h3 style="margin:1.2rem 0 .4rem;color:var(--accent);font-size:1rem">المفردات (${lesson.items.length})</h3><div class="vocab-grid">`;
    lesson.items.forEach(it=>{
      body += `<div class="vocab-item" onclick="speak('${esc(it.es)}')"><span class="es">${esc(it.es)}</span><span class="ar">${esc(it.ar)}</span></div>`;
    });
    body += `</div>`;
  }
  const done = isDone(lesson.id);
  return `
    <div class="view">
      <button class="back-btn" onclick="go('lessons')">→ عودة للدروس</button>
      <div class="card">
        <div class="lesson-head">
          <div class="meta-row">
            <span class="badge unit">وحدة ${unit.order} — ${esc(unit.title_ar)}</span>
            ${badge(lesson.kind,unit.level)}
          </div>
          <h2>${esc(lesson.title_es)}</h2>
          <div class="ar-title">${esc(lesson.title_ar)}</div>
        </div>
        ${body}
        <div class="lesson-actions">
          <button class="btn ${done?'done':'primary'}" onclick="toggleLessonDone('${lesson.id}')">
            ${done?'✓ مكتمل':'○ حدّد كمكتمل'}
          </button>
        </div>
        <div class="nav-prev-next">
          ${prev?`<button class="btn" onclick="openLesson('${prev.lesson.id}')">→ السابق</button>`:'<span></span>'}
          ${next?`<button class="btn" onclick="openLesson('${next.lesson.id}')">التالي ←</button>`:'<span></span>'}
        </div>
      </div>
    </div>`;
}

function renderVocab(){
  const q = state.vocabQuery.trim().toLowerCase();
  const list = q ? ALL_VOCAB.filter(v=>v.es.toLowerCase().includes(q)||v.ar.includes(q)) : ALL_VOCAB;
  const limit = list.slice(0, 300);
  return `
    <div class="view">
      <div class="section-title"><h3>المفردات (${ALL_VOCAB.length})</h3></div>
      <input class="vocab-search" id="vocabInput" type="text" placeholder="ابحث بالعربية أو الإسبانية..." value="${esc(state.vocabQuery)}">
      <div style="color:var(--muted);font-size:.82rem;margin-bottom:.8rem">${list.length} نتيجة${list.length>300?' — يُعرض أول 300':''}</div>
      <div class="vocab-grid">
        ${limit.map(v=>`
          <div class="vocab-item" onclick="speak('${esc(v.es)}')">
            <span class="es">${esc(v.es)}</span>
            <span class="ar">${esc(v.ar)}</span>
          </div>`).join('')}
      </div>
      ${list.length===0?'<div class="empty"><div class="emoji">🔍</div>لا نتائج</div>':''}
    </div>`;
}

function renderFlashcards(){
  const fc = state.fc;
  if(!fc.deck.length){
    return `
      <div class="view">
        <div class="section-title"><h3>بطاقات المراجعة</h3></div>
        <p style="color:var(--muted);margin-bottom:1rem">اختر مجموعة للمراجعة:</p>
        <div class="fc-setup">
          <div class="fc-choice" onclick="startFlashcards('all')">
            <h4>كل المفردات</h4>
            <p>${ALL_VOCAB.length} كلمة</p>
          </div>
          ${DATA.units.map(u=>{
            const c = u.lessons.reduce((s,l)=>s+(l.items?l.items.length:0),0);
            return c>0?`<div class="fc-choice" onclick="startFlashcards('unit-${u.order}')">
              <h4>وحدة ${u.order}</h4>
              <p>${c} كلمة · ${u.level}</p>
            </div>`:'';
          }).join('')}
        </div>
      </div>`;
  }
  const card = fc.deck[fc.i];
  return `
    <div class="view">
      <div class="section-title">
        <h3>بطاقة ${fc.i+1} من ${fc.deck.length}</h3>
        <button class="btn" onclick="exitFlashcards()">خروج</button>
      </div>
      <div class="flashcard ${fc.flipped?'flipped':''}" onclick="flipCard()">
        ${fc.flipped
          ? `<div class="fc-word">${esc(card.ar)}</div><div class="fc-hint">اضغط للرجوع</div>`
          : `<div class="fc-word">${esc(card.es)}</div><div class="fc-hint">اضغط لكشف المعنى</div>`}
      </div>
      <div class="fc-controls">
        <button class="btn" onclick="prevCard()">→ السابق</button>
        <button class="btn" onclick="speak('${esc(card.es)}')">🔊 نطق</button>
        <button class="btn primary" onclick="nextCard()">التالي ←</button>
      </div>
      <div class="fc-counter">${fc.i+1} / ${fc.deck.length}</div>
    </div>`;
}

function render(){
  const app = $('#app');
  let html = '';
  if(state.view==='dashboard') html = renderDashboard();
  else if(state.view==='lessons') html = renderLessons();
  else if(state.view==='lesson') html = renderLesson();
  else if(state.view==='vocab') html = renderVocab();
  else if(state.view==='flashcards') html = renderFlashcards();
  app.innerHTML = html;
  $$('.tab').forEach(t=>t.classList.toggle('active', t.dataset.view===state.view));
  window.scrollTo(0,0);
}

function go(v){state.view=v;render();}
function openLesson(id){state.current=id;state.view='lesson';render();}
function setFilter(k,v){state[k==='level'?'filterLevel':'filterKind']=v;render();}
function filterUnit(order){state.filterLevel='all';state.filterKind='all';state.view='lessons';render();}
function toggleLessonDone(id){toggleDone(id);render();toast(isDone(id)?'تم تحديده كمكتمل':'تم إلغاء التحديد');}

function startFlashcards(scope){
  let deck;
  if(scope==='all') deck = ALL_VOCAB.slice();
  else{
    const order = parseInt(scope.split('-')[1]);
    deck = ALL_VOCAB.filter(v=>v.unit===order);
  }
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  state.fc = {deck, i:0, flipped:false};
  render();
}
function flipCard(){state.fc.flipped=!state.fc.flipped;render();}
function nextCard(){if(state.fc.i<state.fc.deck.length-1){state.fc.i++;state.fc.flipped=false;render();}else{toast('وصلت لنهاية المجموعة');}}
function prevCard(){if(state.fc.i>0){state.fc.i--;state.fc.flipped=false;render();}}
function exitFlashcards(){state.fc={deck:[],i:0,flipped:false};render();}

function openSearch(){
  const ov = $('#searchOverlay');
  ov.classList.add('open');
  setTimeout(()=>$('#searchInput').focus(),50);
  $('#searchInput').value='';
  renderSearch('');
}
function closeSearch(){$('#searchOverlay').classList.remove('open');}
function renderSearch(q){
  q = q.trim().toLowerCase();
  const box = $('#searchResults');
  if(!q){box.innerHTML = '<div class="sr-empty">اكتب للبحث عن درس أو كلمة</div>';return;}
  const lessons = FLAT.filter(({lesson,unit})=>lesson.title_es.toLowerCase().includes(q)||lesson.title_ar.includes(q)||unit.title_ar.includes(q)).slice(0,8);
  const vocab = ALL_VOCAB.filter(v=>v.es.toLowerCase().includes(q)||v.ar.includes(q)).slice(0,12);
  if(!lessons.length && !vocab.length){box.innerHTML = '<div class="sr-empty">لا نتائج</div>';return;}
  let html = '';
  if(lessons.length){
    html += '<div style="padding:.5rem .9rem;color:var(--muted);font-size:.75rem;font-weight:700">الدروس</div>';
    lessons.forEach(({lesson,unit})=>{
      html += `<div class="sr-item" onclick="closeSearch();openLesson('${lesson.id}')">
        <div><div class="ar">${esc(lesson.title_ar)}</div><div style="font-size:.72rem;color:var(--muted);margin-top:.1rem">وحدة ${unit.order} · ${unit.level}</div></div>
        <div class="es">${esc(lesson.title_es)}</div>
      </div>`;
    });
  }
  if(vocab.length){
    html += '<div style="padding:.5rem .9rem;color:var(--muted);font-size:.75rem;font-weight:700;margin-top:.5rem">المفردات</div>';
    vocab.forEach(v=>{
      html += `<div class="sr-item" onclick="event.stopPropagation();speak('${esc(v.es)}')">
        <span class="ar">${esc(v.ar)}</span>
        <span class="es">${esc(v.es)} 🔊</span>
      </div>`;
    });
  }
  box.innerHTML = html;
}

function init(){
  $('#year').textContent = new Date().getFullYear();
  setTheme(store.get('spanish88_theme','dark'));
  updateStreak();

  // preloader 3s
  const pl = $('#preloader');
  window.addEventListener('load', () => {
    setTimeout(() => {
      pl.classList.add('hide');
      setTimeout(() => pl.remove(), 700);
    }, 3000);
  });
  // fallback if load already fired
  if(document.readyState === 'complete'){
    setTimeout(() => { pl.classList.add('hide'); setTimeout(() => pl.remove(), 700); }, 3000);
  }

  $$('.tab').forEach(t=>t.onclick = () => go(t.dataset.view));
  $('#themeBtn').onclick = cycleTheme;
  $('#openSearch').onclick = openSearch;
  $('#searchOverlay').onclick = (e) => { if(e.target.id==='searchOverlay') closeSearch(); };
  $('#searchInput').oninput = (e) => renderSearch(e.target.value);
  document.addEventListener('keydown', (e) => { if(e.key==='Escape') closeSearch(); });

  $('#resetProgress').onclick = () => {
    if(confirm('سيتم إعادة تعيين تاريخ البداية والتقدم. متابعة؟')){
      localStorage.removeItem('spanish88_start');
      localStorage.removeItem('spanish88_progress');
      localStorage.removeItem('spanish88_streak');
      toast('تمت إعادة التعيين');
      setTimeout(()=>location.reload(),600);
    }
  };

  document.addEventListener('input', (e) => {
    if(e.target.id==='vocabInput'){
      state.vocabQuery = e.target.value;
      const input = e.target;
      const pos = input.selectionStart;
      render();
      const newInput = $('#vocabInput');
      if(newInput){newInput.focus();newInput.setSelectionRange(pos,pos);}
    }
  });

  render();
}

init();
</script>
</body>
</html>
